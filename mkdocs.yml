site_name: Project Olympus
site_description: Markdown-native Engineering Operating System
site_url: https://aknoru.github.io/PROJECT-OLYMPUS/
repo_name: aknoru/PROJECT-OLYMPUS
repo_url: https://github.com/aknoru/PROJECT-OLYMPUS
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  README.md
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
validation:
  links:
    not_found: ignore
nav:
  - Command Center: index.md
  - Execute:
      - Start Today: quickstart.md
      - Review Cadence: lifecycle.md
      - Recovery: appendices.md
  - Explore:
      - Repository Map: navigation.md
      - System Model: system-model.md
      - Architecture: architecture.md
  - Maintain:
      - Repository Health: repository-health.md
      - Repository Statistics: repository-statistics.md
      - Reports: reports.md
      - Architecture Decisions: adrs.md
      - Migration Guide: migration-guide.md
      - FAQ: faq.md
