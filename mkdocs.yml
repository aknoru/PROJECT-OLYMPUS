site_name: Project Olympus
site_description: Markdown-native Engineering Operating System
site_url: https://example.invalid/project-olympus/
repo_name: project-olympus
docs_dir: docs
exclude_docs: |
  README.md
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
validation:
  links:
    not_found: ignore
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Navigation: navigation.md
  - System Model: system-model.md
  - Lifecycle: lifecycle.md
  - Architecture: architecture.md
  - ADRs: adrs.md
  - Reports: reports.md
  - Appendices: appendices.md
  - Repository Statistics: repository-statistics.md
  - Repository Health: repository-health.md
  - FAQ: faq.md
  - Migration Guide: migration-guide.md
