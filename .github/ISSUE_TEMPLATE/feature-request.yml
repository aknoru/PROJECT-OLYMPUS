name: Engineering improvement
description: Propose automation, tooling, or maintainability work.
title: "[engineering] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected decision
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed bounded change
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture and migration impact
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance and verification plan
    validations:
      required: true
