name: Documentation quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_markdown.py
      - run: python scripts/validate_mermaid.py
      - run: python scripts/validate_frontmatter.py
