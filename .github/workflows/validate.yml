name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/validate_repository.py --json data/generated/validation-report.json
      - run: python scripts/check_tree.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-report
          path: data/generated/validation-report.json
